                eng: { title: '📌 지속 가능한 소비(제로웨이스트) 실천을 위한 영문 가이드북 제작', tasks: ['친환경 생활 실천 영문 가이드북 작성', '제로웨이스트 영문 홍보 포스터 기획'] },
                sci: { title: '📌 도심 서식지 파편화에 따른 생물 다양성 감소 영향 탐구', tasks: ['도시 숲 생태 통로 설계안 작성', '생물 다양성 보전 활동 계획서 수립'] },
                geo: { title: '📌 지속 가능한 자원 순환 시스템 구축을 위한 친환경 조례안 작성', tasks: ['자원 순환 활성화 지방조례 제안서 작성', '친환경 소비 실천 가이드 제작'] },
                pol: { title: '📌 도심 생태계 파편화 해결을 위한 국제 기구 및 국가 간 정치 협력 탐구', tasks: ['국제 환경 협약 이행 촉구 서한 작성', '환경 NGO 활동 기획서 수립'] },
                env: { title: '📌 지속 가능한 지역사회를 위한 자원 순환 및 탄소중립 실천 프로젝트', tasks: ['학교 탄소발자국 진단서 작성', '자원 순환 캠페인 계획서 수립'] },
                eth: { title: '📌 지속 가능한 삶을 위한 친환경 소비 및 절제하는 도덕적 삶의 실천', tasks: ['친환경 소비 윤리 가치관 선언서 제정', '제로웨이스트 실천 일지 작성'] },
                art: { title: '📌 기후 변화와 연안 침식을 주제로 한 메시지 전달형 인포그래픽 디자인', tasks: ['해수면 상승 경각심 인포그래픽 제작', '환경 캠페인 굿즈 디자인'] },
                tech: { title: '📌 도심 생태 파편화 방지 및 에너지 절감을 위한 스마트 그린 홈 적정기술', tasks: ['친환경 스마트 주거 공간 입체 모형/도면 설계', '적정기술 적용 제안서 제작'] }
            }
        };

        function App() {
            const [step, setStep] = useState(1);
            const [selectedSchool, setSelectedSchool] = useState(SCHOOL_LEVELS[0]);
            const [selectedZone, setSelectedZone] = useState(ZONES[0]);
            
            const filteredSubjects = useMemo(() => {
                return SUBJECTS.filter(sub => sub.level === selectedSchool.id);
            }, [selectedSchool]);

            const [selectedSubject, setSelectedSubject] = useState(filteredSubjects[0] || SUBJECTS[0]);
            const [selectedExpert, setSelectedExpert] = useState(EXPERTS[0]);
            const [selectedDate, setSelectedDate] = useState('2026-10-14');

            const handleSchoolSelect = (school) => {
                setSelectedSchool(school);
                const nextSubjects = SUBJECTS.filter(sub => sub.level === school.id);
                if (nextSubjects.length > 0) {
                    setSelectedSubject(nextSubjects[0]);
                }
            };

            const currentProject = PROJECT_MAP[selectedZone.id]?.[selectedSubject.id] || {
                title: '📌 맞춤형 생태 탐구 프로젝트',
                tasks: ['생태 현장 데이터 수집', '데이터 정제 및 분석', '정책 제안 및 결과보고서 제출']
            };

            return (
                <div className="max-w-xl mx-auto min-h-screen bg-white shadow-md flex flex-col">
                    <header className="bg-emerald-600 text-white p-4 shadow-sm flex justify-between items-center">
                        <h1 className="font-bold text-lg">🌿 LUCA 생태 탐사 설계</h1>
                        <span className="text-xs bg-emerald-700 px-2 py-1 rounded">교사용 모드</span>
                    </header>

                    <div className="bg-slate-100 p-3 border-b flex justify-between text-xs font-semibold text-slate-500 overflow-x-auto">
                        <span className={step >= 1 ? 'text-emerald-600 font-bold' : ''}>1. 학교급</span>
                        <span>›</span>
                        <span className={step >= 2 ? 'text-emerald-600 font-bold' : ''}>2. 권역</span>
                        <span>›</span>
                        <span className={step >= 3 ? 'text-emerald-600 font-bold' : ''}>3. 과목</span>
                        <span>›</span>
                        <span className={step >= 4 ? 'text-emerald-600 font-bold' : ''}>4. 프로젝트</span>
                        <span>›</span>
                        <span className={step >= 5 ? 'text-emerald-600 font-bold' : ''}>5. 전문가</span>
                    </div>

                    <main className="flex-1 p-5">
                        {step === 1 && (
                            <div className="space-y-4">
                                <h2 className="text-lg font-bold text-slate-800">STEP 1. 학교급을 선택하세요</h2>
                                <div className="space-y-3">
                                    {SCHOOL_LEVELS.map((school) => (
                                        <div 
                                            key={school.id}
                                            onClick={() => handleSchoolSelect(school)}
                                            className={`p-4 border rounded-xl cursor-pointer transition ${selectedSchool.id === school.id ? 'border-emerald-500 bg-emerald-50 ring-2 ring-emerald-500/20' : 'hover:border-slate-300'}`}
                                        >
                                            <h3 className="font-bold text-slate-800 text-base">{school.name}</h3>
                                            <p className="text-xs text-slate-600 mt-1">{school.desc}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {step === 2 && (
                            <div className="space-y-4">
                                <h2 className="text-lg font-bold text-slate-800">STEP 2. 탐사 권역을 선택하세요</h2>
                                <div className="space-y-2">
                                    {ZONES.map((zone) => (
                                        <div 
                                            key={zone.id}
                                            onClick={() => setSelectedZone(zone)}
                                            className={`p-4 border rounded-xl cursor-pointer transition ${selectedZone.id === zone.id ? 'border-emerald-500 bg-emerald-50 ring-2 ring-emerald-500/20' : 'hover:border-slate-300'}`}
                                        >
                                            <h3 className="font-bold text-slate-800">{zone.name}</h3>
                                            <p className="text-xs text-emerald-600 font-medium mt-0.5">지역: {zone.cities}</p>
                                            <p className="text-xs text-slate-500 mt-1">{zone.desc}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {step === 3 && (
                            <div className="space-y-4">
                                <div className="flex justify-between items-end">
                                    <div>
                                        <h2 className="text-lg font-bold text-slate-800">STEP 3. 담당 과목을 선택하세요</h2>
                                        <span className="text-xs text-emerald-600 font-medium">선택된 학교급: {selectedSchool.name}</span>
                                    </div>
                                    <span className="text-xs text-slate-500">총 {filteredSubjects.length}개 교과</span>
                                </div>
                                <div className="space-y-2 max-h-[440px] overflow-y-auto pr-1">
                                    {filteredSubjects.map((sub) => (
                                        <div 
                                            key={sub.id}
                                            onClick={() => setSelectedSubject(sub)}
                                            className={`p-3.5 border rounded-xl cursor-pointer transition ${selectedSubject.id === sub.id ? 'border-emerald-500 bg-emerald-50 ring-2 ring-emerald-500/20' : 'hover:border-slate-300'}`}
                                        >
                                            <div className="flex justify-between items-center mb-1">
                                                <span className="text-xs font-bold text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded">{sub.dept}</span>
                                                <span className="text-xs font-mono text-slate-400">{sub.code}</span>
                                            </div>
                                            <h3 className="font-bold text-slate-800 text-sm">{sub.name}</h3>
                                            <p className="text-xs text-slate-600 mt-0.5">{sub.desc}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {step === 4 && (
                            <div className="space-y-4">
                                <h2 className="text-lg font-bold text-slate-800">STEP 4. 맞춤형 프로젝트 확인</h2>
                                <div className="bg-emerald-50 border border-emerald-200 rounded-xl p-4 space-y-3">
                                    <div className="flex items-center space-x-2">
                                        <span className="bg-emerald-600 text-white text-xs px-2 py-0.5 rounded">매칭 완료</span>
                                        <h3 className="font-bold text-emerald-900 text-sm">
                                            [{selectedSchool.name}] {selectedZone.name} x {selectedSubject.name}
                                        </h3>
                                    </div>
                                    <div className="bg-white p-3.5 rounded-lg border text-sm space-y-2">
                                        <p className="font-bold text-slate-800">{currentProject.title}</p>
                                        <div className="text-xs font-semibold text-slate-500 mt-2">주요 산출물:</div>
                                        <ul className="text-xs text-slate-600 list-disc list-inside space-y-1">
                                            {currentProject.tasks.map((task, idx) => (
                                                <li key={idx}>{task}</li>
                                            ))}
                                        </ul>
                                    </div>
                                    
                                    <div className="flex gap-2">
                                        <a href="./guide.pdf" download className="flex-1 bg-white border border-slate-300 text-slate-800 text-xs py-2 rounded-lg font-medium hover:bg-slate-50 text-center flex items-center justify-center">
                                            📄 지도안 다운로드
                                        </a>
                                        <a href="./student_guide.pdf" download className="flex-1 bg-white border border-slate-300 text-slate-800 text-xs py-2 rounded-lg font-medium hover:bg-slate-50 text-center flex items-center justify-center">
                                            📱 학생용 가이드
                                        </a>
                                    </div>
                                </div>
                            </div>
                        )}

                        {step === 5 && (
                            <div className="space-y-4">
                                <h2 className="text-lg font-bold text-slate-800">STEP 5. 전문가 매칭 및 일정 선택</h2>
                                <div className="space-y-3">
                                    <label className="block text-xs font-bold text-slate-600">지원 전문가 선택</label>
                                    {EXPERTS.map((exp) => (
                                        <div 
                                            key={exp.id}
                                            onClick={() => setSelectedExpert(exp)}
                                            className={`p-3 border rounded-lg cursor-pointer transition ${selectedExpert.id === exp.id ? 'border-emerald-500 bg-emerald-50 ring-2 ring-emerald-500/20' : 'hover:border-slate-300'}`}
                                        >
                                            <div className="font-bold text-sm">{exp.name} <span className="text-xs font-normal text-slate-500">({exp.field})</span></div>
                                            <div className="text-xs text-slate-600">{exp.desc}</div>
                                        </div>
                                    ))}

                                    <label className="block text-xs font-bold text-slate-600 mt-4">수업 희망 일자</label>
                                    <input 
                                        type="date" 
                                        value={selectedDate} 
                                        onChange={(e) => setSelectedDate(e.target.value)}
                                        className="w-full p-2 border rounded-lg text-sm bg-white"
                                    />
                                </div>
                            </div>
                        )}

                        {step === 6 && (
                            <div className="text-center py-6 space-y-4">
                                <div className="text-4xl">🎉</div>
                                <h2 className="text-xl font-bold text-slate-800">프로젝트 예약 완료!</h2>
                                <p className="text-xs text-slate-500">선택하신 조건으로 수업 패키지 생성이 완료되었습니다.</p>

                                <div className="bg-slate-50 border p-4 rounded-xl text-left text-xs space-y-2">
                                    <div><span className="font-bold">학교급:</span> {selectedSchool.name}</div>
                                    <div><span className="font-bold">권역:</span> {selectedZone.name}</div>
                                    <div><span class="font-bold">과목:</span> {selectedSubject.name} ({selectedSubject.code})</div>
                                    <div><span className="font-bold">프로젝트:</span> {currentProject.title.replace('📌 ', '')}</div>
                                    <div><span className="font-bold">전문가:</span> {selectedExpert.name} ({selectedExpert.field})</div>
                                    <div><span className="font-bold">일시:</span> {selectedDate}</div>
                                </div>

                                <div className="space-y-2 pt-2">
                                    <a href="./guide.pdf" download className="block w-full bg-emerald-600 text-white text-xs py-3 rounded-xl font-bold shadow hover:bg-emerald-700 text-center">
                                        📄 행정 결재용 서류 패키지 다운로드 (.pdf)
                                    </a>
                                </div>
                            </div>
                        )}
                    </main>

                    {step < 6 && (
                        <footer className="p-4 border-t bg-white flex justify-between gap-3">
                            {step > 1 && (
                                <button 
                                    onClick={() => setStep(step - 1)}
                                    className="flex-1 py-3 border rounded-xl text-sm font-bold text-slate-600 hover:bg-slate-50"
                                >
                                    이전
                                </button>
                            )}
                            <button 
                                onClick={() => setStep(step + 1)}
                                className="flex-1 py-3 bg-emerald-600 text-white rounded-xl text-sm font-bold shadow hover:bg-emerald-700"
                            >
                                {step === 5 ? '최종 예약 완료' : '다음 단계 >'}
                            </button>
                        </footer>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
